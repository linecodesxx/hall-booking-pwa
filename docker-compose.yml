services:
  backend:
    build: ./backend
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    env_file: ./backend/.env
    volumes:
      - hall-booking-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_PUSH_ENABLED: ${VITE_PUSH_ENABLED:-false}
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Доступен только на сервере; публичный трафик принимает системный Nginx.
      - "127.0.0.1:8080:80"

volumes:
  hall-booking-data:
